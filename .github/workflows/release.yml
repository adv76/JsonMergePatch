name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    environment:
      name: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="${VERSION%%[-+]*}"
          IFS='.' read -r MAJOR MINOR PATCH _ <<< "$BASE"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          YY="$(date -u +%y)"
          MMDD="$(date -u +%m%d)"
          ASSEMBLY_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          FILE_VERSION="${MAJOR}.${MINOR}.${PATCH}${YY}.${MMDD}"
          dotnet pack --configuration Release --output ./nupkg /p:Version=$VERSION /p:AssemblyVersion=$ASSEMBLY_VERSION /p:FileVersion=$FILE_VERSION

      - name: NuGet login (Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
